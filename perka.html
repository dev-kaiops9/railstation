<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Perka — RailStatiON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebarMount"></div>

  <main class="main">
    <div id="topbarMount"></div>

    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-target="tabPerka">
        <span class="tab-icon" data-icon="train"></span>
        <span class="tab-copy"><span class="tab-title">Daftar Waktu</span><span class="tab-desc">Data perjalanan KA di stasiun</span></span>
      </button>
      <button class="tab-btn" data-target="tabJalur">
        <span class="tab-icon" data-icon="route"></span>
        <span class="tab-copy"><span class="tab-title">Jalur &amp; Emplasemen</span><span class="tab-desc">Spesifikasi jalur dan emplasemen</span></span>
      </button>
    </div>

    <div class="tab-panel active" id="tabPerka">
      <div class="section">
        <div class="section-head">
          <h3>Daftar Waktu</h3>
          <div class="section-head-actions">
            <div class="error-msg" id="errPerka" style="margin:0;"></div>
            <button class="btn btn-secondary btn-sm" id="cancelPerka" style="display:none;">Batal</button>
            <button class="btn btn-secondary btn-sm" id="editStasiun">Edit Stasiun</button>
            <button class="btn btn-primary btn-sm" id="editPerka">Edit Data</button>
          </div>
        </div>

        <div class="card-panel" id="stasiunNamaForm" style="display:none; margin-bottom:16px;">
          <div class="section-head" style="padding:16px 16px 0 16px; margin-bottom:0;">
            <h4 style="font-size:13px; font-weight:700; color:var(--primary);">Nama Stasiun</h4>
            <div class="section-head-actions">
              <div class="error-msg" id="errStasiunNama" style="margin:0;"></div>
              <button class="btn btn-secondary btn-sm" id="cancelStasiunNama">Batal</button>
              <button class="btn btn-primary btn-sm" id="saveStasiunNama">Simpan Nama Stasiun</button>
            </div>
          </div>
          <div class="grid-stasiun-nama">
            <div class="field"><label for="stasiunNamaA">Stasiun A</label><input type="text" id="stasiunNamaA" placeholder="Stasiun A"></div>
            <div class="field"><label for="stasiunNamaB">Stasiun B</label><input type="text" id="stasiunNamaB" placeholder="Stasiun B"></div>
            <div class="field"><label for="stasiunNamaC">Stasiun C</label><input type="text" id="stasiunNamaC" placeholder="Stasiun C"></div>
            <div class="field"><label for="stasiunNamaD">Stasiun D</label><input type="text" id="stasiunNamaD" placeholder="Stasiun D"></div>
            <div class="field"><label for="stasiunNamaE">Stasiun E</label><input type="text" id="stasiunNamaE" placeholder="Stasiun E"></div>
          </div>
        </div>

        <div id="perkaPanel"></div>
      </div>
    </div>
    <div class="tab-panel" id="tabJalur">
      <div class="section">
        <div class="section-head">
          <h3>Gambar Emplasemen</h3>
          <div class="section-head-actions">
            <div class="error-msg" id="errEmplasemenGambar" style="margin:0;"></div>
            <button class="btn btn-secondary btn-sm" id="cancelEmplasemenGambar" style="display:none;">Batal</button>
            <button class="btn btn-primary btn-sm" id="saveEmplasemenGambar" style="display:none;">Simpan Gambar</button>
            <button class="btn btn-primary btn-sm" id="editEmplasemenGambar">Edit Data</button>
          </div>
        </div>
        <div class="card-panel emplasemen-card">
          <div class="emplasemen-preview-wrap" id="emplasemenPreviewWrap">
            <img id="emplasemenPreviewImg" class="emplasemen-preview-img" style="display:none;" alt="Gambar Emplasemen">
            <div class="emplasemen-empty" id="emplasemenEmptyState">
              <span class="icon" data-icon="route" style="width:40px;height:40px;color:var(--text-soft);"></span>
              <p>Belum ada gambar emplasemen.</p>
              <p class="emplasemen-empty-sub">Klik "Edit Data" untuk memilih dan menyimpan gambar.</p>
            </div>
          </div>
          <div class="emplasemen-upload-row" id="emplasemenUploadRow" style="display:none;">
            <label class="btn btn-secondary btn-sm" for="emplasemenFileInput">Pilih Gambar</label>
            <input type="file" id="emplasemenFileInput" accept="image/*" style="display:none;">
            <span class="emplasemen-filename" id="emplasemenFileName">Belum ada gambar dipilih.</span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <h3>Jalur &amp; Emplasemen</h3>
          <div class="section-head-actions">
            <div class="error-msg" id="errJalur" style="margin:0;"></div>
            <button class="btn btn-secondary btn-sm" id="cancelJalur" style="display:none;">Batal</button>
            <button class="btn btn-primary btn-sm" id="editJalur">Edit Data</button>
          </div>
        </div>
        <div id="jalurPanel"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/entities.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/crud-page.js"></script>
<script>
(async () => {
  const session = await initPage('perka', 'Data Perka', 'Perjalanan kereta api dan spesifikasi jalur/emplasemen.');
  if (!session) return;

  initTabs('tabs');

  // --- Nama Stasiun (dipakai sebagai label header kolom Datang/Berangkat di
  // tabel Daftar Waktu, karena tiap stasiun beda-beda) — disimpan lewat
  // mekanisme Profil Stasiun yang sudah ada (getProfil/saveProfil), jadi
  // tidak perlu sheet atau entitas baru di backend.
  const STASIUN_KEYS = ['A', 'B', 'C', 'D', 'E'];
  const profilRes = await API.getProfil();
  const savedNama = {};
  STASIUN_KEYS.forEach(k => {
    const val = (profilRes.ok && profilRes.data['perkaStasiun' + k]) ? profilRes.data['perkaStasiun' + k] : '';
    savedNama[k] = val;
    document.getElementById('stasiunNama' + k).value = val;
  });

  function applyStasiunLabels(nama) {
    const cfg = ENTITY_CONFIG.perka;
    const groupIdxByKey = { A: 3, B: 4, C: 5, D: 6, E: 7 };
    STASIUN_KEYS.forEach(k => {
      const label = nama[k] && nama[k].trim() ? nama[k].trim() : ('Stasiun ' + k);
      cfg.tableColumnGroups[groupIdxByKey[k]].label = label;
      [cfg.tableColumns, cfg.fields].forEach(list => {
        list.forEach(item => {
          if (item.key === 'stasiun' + k + 'Datang') item.label = label + ' - Datang';
          if (item.key === 'stasiun' + k + 'Berangkat') item.label = label + ' - Berangkat';
        });
      });
    });
  }

  applyStasiunLabels(savedNama);

  // --- Sub-menu: Daftar Waktu (edit inline langsung di tabel, seperti Data Pegawai) ---
  // variant 'plain': judul & tombol "Edit Data" sudah disediakan manual di section-head
  // di atas, jadi kartu ini tidak perlu render judul sendiri (biar tidak dobel).
  const perkaCard = mountInlineTableCard('perkaPanel', 'perka', 'Daftar Waktu', { variant: 'plain' });
  wireEditToggle('editPerka', 'cancelPerka', 'errPerka', [perkaCard]);

  // --- Sub-menu: Jalur & Emplasemen (edit inline langsung di tabel, sama
  // seperti Daftar Waktu — 1 tombol "Edit Data" di section-head mengontrol
  // mode edit untuk semua baris sekaligus, bukan modal per baris). ---
  const jalurCard = mountInlineTableCard('jalurPanel', 'jalur', 'Jalur & Emplasemen', { variant: 'plain' });
  wireEditToggle('editJalur', 'cancelJalur', 'errJalur', [jalurCard]);

  // --- Gambar Emplasemen: upload gambar besar (denah/foto emplasemen).
  // File-nya diupload ke Google Drive lewat API.uploadFile (folder terpisah
  // "Emplasemen" di Drive), lalu URL & fileId hasilnya disimpan sebagai key
  // baru di Profil Stasiun (getProfil/saveProfil yang sudah ada) — sama
  // seperti pola Nama Stasiun di atas, jadi tidak perlu sheet/entitas baru.
  const emplasemenPreviewImg = document.getElementById('emplasemenPreviewImg');
  const emplasemenEmptyState = document.getElementById('emplasemenEmptyState');
  const emplasemenUploadRow = document.getElementById('emplasemenUploadRow');
  const emplasemenFileInput = document.getElementById('emplasemenFileInput');
  const emplasemenFileName = document.getElementById('emplasemenFileName');
  const editEmplasemenBtn = document.getElementById('editEmplasemenGambar');
  const saveEmplasemenBtn = document.getElementById('saveEmplasemenGambar');
  const cancelEmplasemenBtn = document.getElementById('cancelEmplasemenGambar');
  const errEmplasemenEl = document.getElementById('errEmplasemenGambar');
  let emplasemenSelectedFile = null;
  let emplasemenSavedFileId = null;

  function showEmplasemenPreview(url) {
    if (url) {
      emplasemenPreviewImg.src = url;
      emplasemenPreviewImg.style.display = 'block';
      emplasemenEmptyState.style.display = 'none';
    } else {
      emplasemenPreviewImg.style.display = 'none';
      emplasemenEmptyState.style.display = 'block';
    }
  }

  // URL "uc?export=view" dari Google Drive kadang tidak stabil dipakai
  // langsung sebagai src <img> — Drive bisa membalas halaman peringatan
  // (bukan file gambar mentah) sehingga gambar gagal tampil walau file-nya
  // valid. Endpoint thumbnail jauh lebih stabil untuk kasus ini, jadi URL
  // tampilan selalu dibangun dari fileId yang tersimpan, bukan dari field
  // url mentahnya.
  function driveThumbnailUrl(fileId) {
    return fileId ? ('https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1600') : '';
  }

  // profilRes sudah diambil sekali di atas (dipakai juga untuk Nama Stasiun)
  emplasemenSavedFileId = profilRes.ok ? profilRes.data.emplasemenGambarFileId : '';
  showEmplasemenPreview(driveThumbnailUrl(emplasemenSavedFileId));

  // --- Toggle edit-mode: default hanya tombol "Edit Data" yang tampil.
  // Saat diklik, baris upload ("Pilih Gambar") + tombol "Simpan Gambar" &
  // "Batal" muncul, dan tombol "Edit Data" disembunyikan — jadi cuma 1
  // tombol edit yang mengendalikan mode edit gambar ini. ---
  function enterEmplasemenEditMode() {
    errEmplasemenEl.classList.remove('show');
    emplasemenUploadRow.style.display = 'flex';
    saveEmplasemenBtn.style.display = '';
    cancelEmplasemenBtn.style.display = '';
    editEmplasemenBtn.style.display = 'none';
  }

  function exitEmplasemenEditMode() {
    emplasemenUploadRow.style.display = 'none';
    saveEmplasemenBtn.style.display = 'none';
    cancelEmplasemenBtn.style.display = 'none';
    editEmplasemenBtn.style.display = '';
    errEmplasemenEl.classList.remove('show');
  }

  editEmplasemenBtn.addEventListener('click', () => {
    enterEmplasemenEditMode();
  });

  cancelEmplasemenBtn.addEventListener('click', () => {
    emplasemenSelectedFile = null;
    emplasemenFileInput.value = '';
    emplasemenFileName.textContent = 'Belum ada gambar dipilih.';
    showEmplasemenPreview(driveThumbnailUrl(emplasemenSavedFileId));
    exitEmplasemenEditMode();
  });

  emplasemenFileInput.addEventListener('change', () => {
    const file = emplasemenFileInput.files[0];
    errEmplasemenEl.classList.remove('show');
    if (!file) {
      emplasemenSelectedFile = null;
      emplasemenFileName.textContent = 'Belum ada gambar dipilih.';
      return;
    }
    emplasemenSelectedFile = file;
    emplasemenFileName.textContent = file.name;
    // Preview lokal langsung (sebelum diupload) supaya pengguna lihat gambar
    // yang dipilih tanpa harus menunggu proses simpan selesai dulu.
    showEmplasemenPreview(URL.createObjectURL(file));
  });

  saveEmplasemenBtn.addEventListener('click', async () => {
    if (!emplasemenSelectedFile) {
      errEmplasemenEl.textContent = 'Pilih gambar terlebih dahulu sebelum menyimpan.';
      errEmplasemenEl.classList.add('show');
      return;
    }
    saveEmplasemenBtn.disabled = true;
    saveEmplasemenBtn.textContent = 'Mengunggah...';
    errEmplasemenEl.classList.remove('show');
    try {
      const uploadResult = await API.uploadFile(emplasemenSelectedFile, 'Emplasemen');
      if (!uploadResult.ok) throw new Error(uploadResult.error || 'Gagal mengunggah gambar ke Google Drive');
      const saveResult = await API.saveProfil({
        emplasemenGambarUrl: uploadResult.data.url,
        emplasemenGambarFileId: uploadResult.data.fileId,
      });
      if (!saveResult.ok) throw new Error(saveResult.error || 'Gagal menyimpan referensi gambar');
      emplasemenSavedFileId = uploadResult.data.fileId;
      showEmplasemenPreview(driveThumbnailUrl(emplasemenSavedFileId));
      emplasemenSelectedFile = null;
      emplasemenFileInput.value = '';
      emplasemenFileName.textContent = 'Belum ada gambar dipilih.';
      exitEmplasemenEditMode();
    } catch (err) {
      errEmplasemenEl.textContent = err.message;
      errEmplasemenEl.classList.add('show');
    } finally {
      saveEmplasemenBtn.disabled = false;
      saveEmplasemenBtn.textContent = 'Simpan Gambar';
    }
  });

  // --- Toggle form Nama Stasiun: disembunyikan secara default, muncul saat
  // tombol "Edit Stasiun" diklik, dan disembunyikan lagi setelah disimpan
  // atau dibatalkan. ---
  const stasiunForm = document.getElementById('stasiunNamaForm');
  const editStasiunBtn = document.getElementById('editStasiun');
  const errStasiunEl = document.getElementById('errStasiunNama');

  function resetStasiunInputs() {
    STASIUN_KEYS.forEach(k => { document.getElementById('stasiunNama' + k).value = savedNama[k]; });
  }

  function showStasiunForm() {
    resetStasiunInputs();
    errStasiunEl.classList.remove('show');
    stasiunForm.style.display = 'block';
  }

  function hideStasiunForm() {
    stasiunForm.style.display = 'none';
  }

  editStasiunBtn.addEventListener('click', () => {
    if (stasiunForm.style.display === 'none') showStasiunForm();
    else hideStasiunForm();
  });

  document.getElementById('cancelStasiunNama').addEventListener('click', () => {
    hideStasiunForm();
  });

  // --- Simpan Nama Stasiun ---
  document.getElementById('saveStasiunNama').addEventListener('click', async () => {
    const btn = document.getElementById('saveStasiunNama');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    errStasiunEl.classList.remove('show');
    try {
      const data = {};
      STASIUN_KEYS.forEach(k => { data['perkaStasiun' + k] = document.getElementById('stasiunNama' + k).value.trim(); });
      const result = await API.saveProfil(data);
      if (!result.ok) throw new Error(result.error || 'Gagal menyimpan nama stasiun');
      // Header tabel (thead) dirender sekali saat mount — reload halaman supaya
      // label baru langsung terpakai di tabel Daftar Waktu. Form otomatis
      // tersembunyi lagi setelah reload karena defaultnya display:none.
      location.reload();
    } catch (err) {
      errStasiunEl.textContent = err.message;
      errStasiunEl.classList.add('show');
      btn.disabled = false; btn.textContent = 'Simpan Nama Stasiun';
    }
  });
})();
</script>
</body>
</html>
