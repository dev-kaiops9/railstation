<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Perka — RailStatiON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebarMount"></div>

  <main class="main">
    <div id="topbarMount"></div>

    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-target="tabPerka">
        <span class="tab-icon" data-icon="train"></span>
        <span class="tab-copy"><span class="tab-title">Daftar Waktu</span><span class="tab-desc">Waktu datang dan berangkat kereta api</span></span>
      </button>
      <button class="tab-btn" data-target="tabJalur">
        <span class="tab-icon" data-icon="route"></span>
        <span class="tab-copy"><span class="tab-title">Jalur &amp; Emplasemen</span><span class="tab-desc">Spesifikasi jalur dan emplasemen</span></span>
      </button>
    </div>

    <div class="tab-panel active" id="tabPerka">
      <div class="section-head" style="margin-bottom:14px;">
        <h3 style="visibility:hidden;">.</h3>
        <div class="section-head-actions">
          <div class="error-msg" id="errPerka" style="margin:0;"></div>
          <button class="btn btn-secondary btn-sm" id="cancelPerka" style="display:none;">Batal</button>
          <button class="btn btn-primary btn-sm" id="editPerka">Edit Data</button>
        </div>
      </div>
      <div id="perkaPanel"></div>
    </div>
    <div class="tab-panel" id="tabJalur"><div id="jalurPanel"></div></div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/entities.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/crud-page.js"></script>
<script>
(async () => {
  const session = await initPage('perka', 'Data Perka', 'Perjalanan kereta api dan spesifikasi jalur/emplasemen.');
  if (!session) return;

  initTabs('tabs');
  const perkaCard = mountInlineTableCard('perkaPanel', 'perka', 'Daftar Waktu', { variant: 'section' });
  wireEditToggle('editPerka', 'cancelPerka', 'errPerka', [perkaCard]);
  mountCrudSection('jalurPanel', 'jalur', 'Jalur & Emplasemen');
})();
</script>
</body>
</html>
