<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Stasiun — RailStatiON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebarMount"></div>

  <main class="main">
    <div id="topbarMount"></div>

    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-target="tabInfo">
        <span class="tab-icon" data-icon="mapPin"></span>
        <span class="tab-copy"><span class="tab-title">Informasi &amp; Lokasi</span><span class="tab-desc">Identitas, lokasi, dan fasilitas stasiun</span></span>
      </button>
      <button class="tab-btn" data-target="tabJadwalKA">
        <span class="tab-icon" data-icon="train"></span>
        <span class="tab-copy"><span class="tab-title">Jadwal KA Berhenti</span><span class="tab-desc">Kereta api yang berhenti di stasiun</span></span>
      </button>
    </div>

    <div class="tab-panel active" id="tabInfo">
      <div class="section">
        <div class="section-head">
          <h3>Identitas Stasiun</h3>
          <button class="btn btn-primary btn-sm" id="openProfilManage">Edit Data</button>
        </div>
        <div class="info-cards">
          <div class="info-card">
            <h4>Informasi Stasiun</h4>
            <div class="info-row"><span class="k">Nama Stasiun</span><span class="v" id="v_nama">—</span></div>
            <div class="info-row"><span class="k">Singkatan</span><span class="v" id="v_singkatan">—</span></div>
            <div class="info-row"><span class="k">Kelas</span><span class="v" id="v_kelas">—</span></div>
            <div class="info-row"><span class="k">Kode</span><span class="v" id="v_kode">—</span></div>
            <div class="info-row"><span class="k">Waktu Operasional</span><span class="v" id="v_waktuOperasional">—</span></div>
          </div>
          <div class="info-card">
            <h4>Lokasi</h4>
            <div class="info-row"><span class="k">KM (Kilometer Jalur)</span><span class="v" id="v_km">—</span></div>
            <div class="info-row"><span class="k">Ketinggian (mdpl)</span><span class="v" id="v_ketinggian">—</span></div>
            <div class="info-row"><span class="k">Wilayah</span><span class="v" id="v_wilayah">—</span></div>
            <div class="info-row"><span class="k">Alamat</span><span class="v" id="v_alamat">—</span></div>
          </div>
          <div id="fasilitasCard"></div>
          <div id="fasilitasUmumCard"></div>
        </div>
      </div>
    </div>

    <div class="modal-backdrop manage-backdrop" id="profilManageBackdrop">
      <div class="modal">
        <div class="modal-head">
          <h3>Edit Identitas Stasiun</h3>
          <button class="modal-close" id="profilManageClose" aria-label="Tutup">&times;</button>
        </div>
        <div class="error-msg" id="profilError"></div>
        <form id="profilForm">
          <div class="grid-2">
            <div class="field"><label>Nama Stasiun</label><input type="text" id="p_nama"></div>
            <div class="field"><label>Singkatan</label><input type="text" id="p_singkatan"></div>
            <div class="field"><label>Kelas Stasiun</label><input type="text" id="p_kelas"></div>
            <div class="field"><label>Kode Stasiun</label><input type="text" id="p_kode"></div>
            <div class="field"><label>Waktu Operasional</label><input type="text" id="p_waktuOperasional" placeholder="cth. 05:00 - 23:00"></div>
            <div class="field"><label>KM (Kilometer Jalur)</label><input type="text" id="p_km"></div>
            <div class="field"><label>Ketinggian (mdpl)</label><input type="text" id="p_ketinggian"></div>
            <div class="field"><label>Wilayah</label><input type="text" id="p_wilayah"></div>
          </div>
          <div class="field"><label>Alamat</label><input type="text" id="p_alamat"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="profilCancelBtn">Batal</button>
            <button type="submit" class="btn btn-primary" id="profilSaveBtn">Simpan Profil</button>
          </div>
        </form>
      </div>
    </div>

    <div class="tab-panel" id="tabJadwalKA"><div id="jadwalKAPanel"></div></div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/entities.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/crud-page.js"></script>
<script>
(async () => {
  const session = await initPage('profil-stasiun', 'Profil Stasiun', 'Identitas, fasilitas, dan jadwal KA yang berhenti di stasiun.');
  if (!session) return;

  initTabs('tabs');
  mountCrudSection('fasilitasCard', 'fasilitas', 'Fasilitas & Layanan Stasiun', { compact: true });
  mountCrudSection('fasilitasUmumCard', 'fasilitasUmum', 'Fasilitas Umum Terdekat', { compact: true });
  mountCrudSection('jadwalKAPanel', 'jadwalKA', 'Kereta Api yang Berhenti');

  const profilKeys = ['nama','singkatan','kelas','kode','waktuOperasional','km','ketinggian','alamat','wilayah'];
  const profilManageBackdrop = document.getElementById('profilManageBackdrop');

  function renderProfilView(p) {
    profilKeys.forEach(k => {
      const el = document.getElementById('v_' + k);
      if (el) el.textContent = p[k] || '—';
    });
  }

  // Muat profil singleton
  const res = await API.getProfil();
  if (res.ok) {
    const p = res.data;
    renderProfilView(p);
    profilKeys.forEach(k => {
      const el = document.getElementById('p_' + k);
      if (el) el.value = p[k] || '';
    });
  }

  document.getElementById('openProfilManage').addEventListener('click', () => profilManageBackdrop.classList.add('show'));
  document.getElementById('profilManageClose').addEventListener('click', () => profilManageBackdrop.classList.remove('show'));
  document.getElementById('profilCancelBtn').addEventListener('click', () => profilManageBackdrop.classList.remove('show'));
  profilManageBackdrop.addEventListener('click', (e) => { if (e.target === profilManageBackdrop) profilManageBackdrop.classList.remove('show'); });

  document.getElementById('profilForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('profilSaveBtn');
    const errEl = document.getElementById('profilError');
    errEl.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    const data = {};
    profilKeys.forEach(k => {
      data[k] = document.getElementById('p_' + k).value.trim();
    });
    try {
      const result = await API.saveProfil(data);
      if (!result.ok) throw new Error(result.error);
      renderProfilView(data);
      btn.textContent = 'Tersimpan ✓';
      setTimeout(() => {
        btn.textContent = 'Simpan Profil';
        profilManageBackdrop.classList.remove('show');
      }, 700);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.add('show');
      btn.textContent = 'Simpan Profil';
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
