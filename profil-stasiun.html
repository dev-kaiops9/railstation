<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Stasiun — RailStatiON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebarMount"></div>

  <main class="main">
    <div id="topbarMount"></div>

    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-target="tabInfo">
        <span class="tab-icon" data-icon="mapPin"></span>
        <span class="tab-copy"><span class="tab-title">Informasi &amp; Lokasi</span><span class="tab-desc">Identitas, lokasi, dan fasilitas stasiun</span></span>
      </button>
      <button class="tab-btn" data-target="tabJadwalKA">
        <span class="tab-icon" data-icon="train"></span>
        <span class="tab-copy"><span class="tab-title">Jadwal KA Berhenti</span><span class="tab-desc">Kereta api yang berhenti di stasiun</span></span>
      </button>
    </div>

    <div class="tab-panel active" id="tabInfo">
      <div class="section">
        <div class="section-head">
          <h3>Identitas Stasiun</h3>
          <div class="section-head-actions">
            <div class="error-msg" id="profilError" style="margin:0;"></div>
            <button class="btn btn-secondary btn-sm" id="cancelEditBtn" style="display:none;">Batal</button>
            <button class="btn btn-primary btn-sm" id="editDataBtn">Edit Data</button>
          </div>
        </div>
        <div class="info-cards">
          <div class="info-card">
            <h4>Informasi Stasiun</h4>
            <div class="info-row"><span class="k">Nama Stasiun</span><span class="v" id="v_nama">—</span></div>
            <div class="info-row"><span class="k">Singkatan</span><span class="v" id="v_singkatan">—</span></div>
            <div class="info-row"><span class="k">Kelas</span><span class="v" id="v_kelas">—</span></div>
            <div class="info-row"><span class="k">Kode</span><span class="v" id="v_kode">—</span></div>
            <div class="info-row"><span class="k">Waktu Operasional</span><span class="v" id="v_waktuOperasional">—</span></div>
          </div>
          <div class="info-card">
            <h4>Lokasi</h4>
            <div class="info-row"><span class="k">KM (Kilometer Jalur)</span><span class="v" id="v_km">—</span></div>
            <div class="info-row"><span class="k">Ketinggian (mdpl)</span><span class="v" id="v_ketinggian">—</span></div>
            <div class="info-row"><span class="k">Wilayah</span><span class="v" id="v_wilayah">—</span></div>
            <div class="info-row"><span class="k">Alamat</span><span class="v" id="v_alamat">—</span></div>
          </div>
          <div id="fasilitasCard"></div>
          <div id="fasilitasUmumCard"></div>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tabJadwalKA"><div id="jadwalKAPanel"></div></div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/entities.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/crud-page.js"></script>
<script>
(async () => {
  const session = await initPage('profil-stasiun', 'Profil Stasiun', 'Identitas, fasilitas, dan jadwal KA yang berhenti di stasiun.');
  if (!session) return;

  initTabs('tabs');
  const fasilitasCard = mountInlineCard('fasilitasCard', 'fasilitas', 'Fasilitas & Layanan Stasiun');
  const fasilitasUmumCard = mountInlineCard('fasilitasUmumCard', 'fasilitasUmum', 'Fasilitas Umum Terdekat');
  mountCrudSection('jadwalKAPanel', 'jadwalKA', 'Kereta Api yang Berhenti');

  const profilKeys = ['nama','singkatan','kelas','kode','waktuOperasional','km','ketinggian','alamat','wilayah'];
  let profilData = {};
  let isEditing = false;

  const editDataBtn = document.getElementById('editDataBtn');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const errEl = document.getElementById('profilError');

  function renderProfilView(p) {
    profilKeys.forEach(k => {
      const el = document.getElementById('v_' + k);
      if (el) el.textContent = p[k] || '—';
    });
  }

  function renderProfilEdit(p) {
    profilKeys.forEach(k => {
      const el = document.getElementById('v_' + k);
      if (el) el.innerHTML = `<input type="text" class="inline-input" data-profil-key="${k}" value="${escapeAttr(p[k] || '')}">`;
    });
  }

  function collectProfilEdit() {
    const data = {};
    profilKeys.forEach(k => {
      const input = document.querySelector(`[data-profil-key="${k}"]`);
      data[k] = input ? input.value.trim() : '';
    });
    return data;
  }

  // Muat profil singleton
  const res = await API.getProfil();
  if (res.ok) {
    profilData = res.data;
    renderProfilView(profilData);
  }

  function setEditingUI(editing) {
    isEditing = editing;
    editDataBtn.textContent = editing ? 'Simpan' : 'Edit Data';
    cancelEditBtn.style.display = editing ? 'inline-flex' : 'none';
    errEl.classList.remove('show');
  }

  editDataBtn.addEventListener('click', async () => {
    if (!isEditing) {
      renderProfilEdit(profilData);
      fasilitasCard.enterEdit();
      fasilitasUmumCard.enterEdit();
      setEditingUI(true);
      return;
    }

    // Mode simpan
    editDataBtn.disabled = true;
    editDataBtn.textContent = 'Menyimpan...';
    errEl.classList.remove('show');
    try {
      const newProfil = collectProfilEdit();
      const result = await API.saveProfil(newProfil);
      if (!result.ok) throw new Error(result.error);
      profilData = newProfil;
      await Promise.all([fasilitasCard.save(), fasilitasUmumCard.save()]);
      renderProfilView(profilData);
      setEditingUI(false);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.add('show');
      editDataBtn.textContent = 'Simpan';
    } finally {
      editDataBtn.disabled = false;
    }
  });

  cancelEditBtn.addEventListener('click', () => {
    renderProfilView(profilData);
    fasilitasCard.exitEdit();
    fasilitasUmumCard.exitEdit();
    setEditingUI(false);
  });
})();
</script>
</body>
</html>
